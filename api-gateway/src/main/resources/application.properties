spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# =========================
# GATEWAY
# =========================

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s

# =========================
# AUTH SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[0].filters[0]=CircuitBreaker=name=authServiceCircuitBreaker,fallbackUri=forward:/fallback/auth,statusCodes=500,404,503
spring.cloud.gateway.server.webflux.routes[0].filters[1]=Retry=3

# =========================
# AUCTION SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[1].id=auction-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://AUCTION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auction/**

spring.cloud.gateway.server.webflux.routes[1].filters[0]=CircuitBreaker=name=auctionServiceCircuitBreaker,fallbackUri=forward:/fallback/auction,statusCodes=500,404,503
spring.cloud.gateway.server.webflux.routes[1].filters[1]=Retry=3

jwt.secret=mySuperSecretKeyForJwtTokenGeneration123456789
jwt.gateway.secret=mySuperSecretForJwtTokenValidationInGateway123456789